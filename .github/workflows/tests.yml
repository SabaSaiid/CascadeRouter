name: CI Tests & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Backend Unit & Integration Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -B -m pytest -p no:cacheprovider tests/ -v --ignore=tests/fixtures/ --basetemp "${RUNNER_TEMP}/cascaderouter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
