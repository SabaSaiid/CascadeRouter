name: CI Tests & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest
    env:
      BACKEND_JUNIT_PATH: ${{ runner.temp }}/cascaderouter-junit-${{ github.run_id }}-${{ github.run_attempt }}.xml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Backend Unit & Integration Tests
        id: backend_tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -B -m pytest -p no:cacheprovider tests/ -v -ra --tb=short --ignore=tests/fixtures/ --junitxml "$BACKEND_JUNIT_PATH" --basetemp "${RUNNER_TEMP}/cascaderouter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Summarize Backend Test Results
        if: always()
        env:
          BACKEND_TEST_OUTCOME: ${{ steps.backend_tests.outcome }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["BACKEND_JUNIT_PATH"])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              outcome = os.environ["BACKEND_TEST_OUTCOME"] or "not run"
              summary.write(f"### Backend tests\n\nTest step outcome: `{outcome}`.\n\n")
              if not report.is_file():
                  summary.write("No JUnit report was produced. Inspect earlier job logs; this does not indicate passing tests.\n")
              else:
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
                  counts = {key: sum(int(suite.get(key, "0")) for suite in suites)
                            for key in ("tests", "failures", "errors", "skipped")}
                  summary.write("| Tests | Failures | Errors | Skipped |\n| ---: | ---: | ---: | ---: |\n")
                  summary.write("| {tests} | {failures} | {errors} | {skipped} |\n".format(**counts))
                  summary.write("\nSee the test log for failure details and skip reasons. Pytest's exit status determines the test step result.\n")
          PY

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
